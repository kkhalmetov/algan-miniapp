name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algan-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://algan-bot.online
    env:
      NEXT_PUBLIC_DATA_MODE: ${{ vars.NEXT_PUBLIC_DATA_MODE || 'mock' }}
      NEXT_PUBLIC_RELEASE_MODE: ${{ vars.NEXT_PUBLIC_RELEASE_MODE || 'demo' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_APP_ORIGIN: https://algan-bot.online
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/algan_deploy
          chmod 600 ~/.ssh/algan_deploy
          ssh-keygen -y -P "" -f ~/.ssh/algan_deploy > /dev/null
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          SSH_ARGS=(
            -i ~/.ssh/algan_deploy
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o KexAlgorithms=curve25519-sha256
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )

          ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" true

          PREVIOUS_RELEASE="$(ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
            'target=$(readlink -f /var/www/algan-miniapp/current 2>/dev/null || true); if [ -n "$target" ]; then basename "$target"; fi')"

          for attempt in 1 2 3; do
            if rsync -az --delete -e "ssh ${SSH_ARGS[*]}" \
              dist/client/ "$VPS_USER@$VPS_HOST:/var/www/algan-miniapp/releases/$GITHUB_SHA/"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

          ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
            "/usr/local/bin/algan-activate '$GITHUB_SHA'"

          RELEASE_OK=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              https://algan-bot.online/release.json | grep --fixed-strings --quiet "\"commit\":\"$GITHUB_SHA\""; then
              RELEASE_OK=true
              break
            fi
            sleep "$((attempt * 2))"
          done

          HEADERS="$(curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 \
            https://algan-bot.online/)" || RELEASE_OK=false
          for header in content-security-policy strict-transport-security x-content-type-options; do
            if ! grep --ignore-case --quiet "^$header:" <<<"$HEADERS"; then
              echo "Missing required production header: $header" >&2
              RELEASE_OK=false
            fi
          done

          if [ "$RELEASE_OK" != true ]; then
            if [[ "$PREVIOUS_RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Smoke test failed; rolling back to $PREVIOUS_RELEASE" >&2
              ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
                "/usr/local/bin/algan-activate '$PREVIOUS_RELEASE'"
            fi
            exit 1
          fi
