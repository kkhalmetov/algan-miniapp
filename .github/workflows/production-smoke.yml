name: Production smoke

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algan-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production availability and release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_ORIGIN: https://algan-bot.online
        run: |
          set -Eeuo pipefail

          EXPECTED_SHA="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | jq --raw-output '.sha')"

          RELEASE_OK=false
          for attempt in 1 2 3 4 5 6; do
            RELEASE="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "$PRODUCTION_ORIGIN/release.json")" || RELEASE='{}'

            if jq --exit-status \
              --arg sha "$EXPECTED_SHA" \
              '.status == "ok" and .service == "algan-miniapp" and .commit == $sha' \
              <<<"$RELEASE" > /dev/null; then
              RELEASE_OK=true
              break
            fi

            sleep "$((attempt * 2))"
          done

          if [ "$RELEASE_OK" != true ]; then
            echo "Production does not serve the current main commit $EXPECTED_SHA" >&2
            exit 1
          fi

          HEADERS="$(curl --fail --silent --show-error --head --connect-timeout 5 --max-time 15 \
            "$PRODUCTION_ORIGIN/")"
          for header in content-security-policy strict-transport-security x-content-type-options; do
            grep --ignore-case --quiet "^$header:" <<<"$HEADERS" || {
              echo "Missing required production header: $header" >&2
              exit 1
            }
          done

          for path in manifest.webmanifest robots.txt .well-known/security.txt; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null "$PRODUCTION_ORIGIN/$path"
          done

          HTML="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "$PRODUCTION_ORIGIN/")"
          grep --fixed-strings --quiet 'telegram-web-app.js' <<<"$HTML"
          grep --fixed-strings --quiet 'manifest.webmanifest' <<<"$HTML"
